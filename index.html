<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="KiwiAus Business Australia — professional Australian business solutions."
>

<title>KiwiAus Business Australia</title>

<style>
/* ===== KIWIAUS HOME PAGE FIX ===== */

html,
body {
width: 100%;
margin: 0;
padding: 0;
overflow-x: hidden;
}

.page {
width: 100% !important;
max-width: 100% !important;
display: block !important;
margin: 0 auto !important;
padding: 40px 20px !important;
box-sizing: border-box;
}

.main-box {
width: 100% !important;
max-width: 1100px !important;
display: block !important;
margin: 0 auto !important;
padding: 0 !important;
}

.hero-image {
width: 100% !important;
max-width: 1100px !important;
height: auto !important;
display: block !important;
margin: 0 auto 35px auto !important;
border-radius: 18px;
}

.welcome {
display: block !important;
width: 100% !important;
text-align: center !important;
margin: 10px auto 25px auto !important;
font-size: 18px !important;
color: #6b7280 !important;
}

.language-grid {
width: 100% !important;
max-width: 700px !important;
display: grid !important;
grid-template-columns: 1fr 1fr !important;
gap: 20px !important;
margin: 0 auto !important;
padding: 0 !important;
}

.language-card {
width: 100% !important;
min-height: 90px !important;
display: flex !important;
align-items: center !important;
justify-content: center !important;
box-sizing: border-box !important;
}

footer {
width: 100% !important;
display: block !important;
text-align: center !important;
margin-top: 35px !important;
clear: both !important;
}

@media (max-width: 700px) {

.page {
padding: 28px 16px !important;
}

.hero-image {
width: 100% !important;
max-width: 100% !important;
margin-bottom: 28px !important;
border-radius: 14px !important;
}

.welcome {
font-size: 17px !important;
margin-bottom: 20px !important;
}

.language-grid {
grid-template-columns: 1fr !important;
width: 100% !important;
max-width: 100% !important;
gap: 16px !important;
}

body,
.page,
.main-box {
display: block !important;
}

.language-grid {
display: grid !important;
grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
width: 100% !important;
max-width: 700px !important;
margin: 0 auto !important;
}

.welcome,
.language-grid,
footer {
position: static !important;
float: none !important;
clear: both !important;
}

footer {
margin-top: 30px !important;
}
  
.language-card {
min-height: 82px !important;
font-size: 22px !important;
}
}
</style>
</head>

<body>

<div class="top-line"></div>

<main class="page">

<div class="main-box">

<img
src="kiwiaus-australia-new-zealand.png"
alt="KiwiAus Business Australia and New Zealand"
class="hero-image"
>

</div>



<p class="welcome">
Select your language
</p>

<section class="language-grid">

<a href="/en/" class="language-card">
<span>English</span>
</a>

<a href="/ru/" class="language-card">
<span>Русский</span>
</a>

<a href="/zh-hk/" class="language-card">
<span>香港中文</span>
</a>

<a href="/de/" class="language-card">
<span>Deutsch</span>
</a>

</section>

<div class="contact">
<a href="mailto:info@kiwiaus.com">
info@kiwiaus.com
</a>
</div>

<footer>
© 2026 KiwiAus Business Australia
</footer>

</div>

</main>

</body>
</html>
