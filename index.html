<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="KiwiAus Business Australia — professional Australian business solutions."
>

<title>KiwiAus Business Australia</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
background: linear-gradient(
180deg,
#ffffff 0%,
#f5f7f9 100%
);
color: #172033;
font-family: Arial, Helvetica, sans-serif;
}

.top-line {
width: 100%;
height: 3px;
background: #c58a28;
}

.page {
display: flex;
min-height: calc(100vh - 3px);
align-items: center;
justify-content: center;
padding: 30px 20px;
}

.main-box {
width: 100%;
max-width: 1050px;
text-align: center;
}

.logo {
display: block;
width: 23%;
max-width: 290px;
min-width: 190px;
height: auto;
margin: 0 auto 24px;
background: #ffffff;
border: 1px solid #e3e6e9;
border-radius: 12px;
box-shadow: 0 8px 22px rgba(30, 50, 70, 0.08);
}

h1 {
margin: 0 0 8px;
color: #111820;
font-size: 39px;
font-weight: 600;
line-height: 1.15;
}

.subtitle {
margin-bottom: 12px;
color: #b77d18;
font-size: 20px;
font-weight: 500;
}

.welcome {
margin: 0 0 30px;
color: #747d88;
font-size: 14px;
font-weight: 400;
line-height: 1.5;
}

.language-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 14px;
width: 100%;
margin: 0 auto;
}

.language-card {
display: flex;
min-height: 82px;
align-items: center;
justify-content: center;
padding: 16px 14px;
background: #ffffff;
border: 1px solid #e4e7ea;
border-top: 3px solid #c58a28;
border-radius: 10px;
color: #064a78;
text-decoration: none;
box-shadow: 0 6px 18px rgba(30, 50, 70, 0.05);
transition:
transform 0.2s ease,
box-shadow 0.2s ease,
border-color 0.2s ease;
}

.language-card:hover {
transform: translateY(-4px);
border-color: #c58a28;
box-shadow: 0 12px 26px rgba(30, 50, 70, 0.10);
}

.language-card span {
font-size: 20px;
font-weight: 500;
line-height: 1.2;
letter-spacing: 0.2px;
}

.contact {
margin-top: 27px;
color: #7a8490;
font-size: 13px;
}

.contact a {
color: #064a78;
font-weight: 500;
text-decoration: none;
}

.contact a:hover {
color: #c58a28;
}

footer {
margin-top: 22px;
color: #8a929c;
font-size: 11px;
font-weight: 400;
}

@media (max-width: 900px) {
.language-grid {
grid-template-columns: repeat(2, 1fr);
max-width: 650px;
}
}

@media (max-width: 620px) {
.page {
align-items: flex-start;
padding-top: 26px;
}

.logo {
width: 52%;
min-width: 185px;
max-width: 280px;
}

h1 {
font-size: 30px;
font-weight: 600;
}

.subtitle {
margin-bottom: 11px;
font-size: 18px;
}

.welcome {
margin-bottom: 26px;
}

.language-grid {
grid-template-columns: 1fr;
max-width: 430px;
gap: 12px;
}

.language-card {
min-height: 68px;
padding: 13px 12px;
border-top-width: 2px;
}

.language-card span {
font-size: 19px;
}
}

@media (max-width: 430px) {
.logo {
width: 70%;
min-width: 0;
}

h1 {
font-size: 27px;
}

.subtitle {
font-size: 17px;
}

.welcome {
margin-bottom: 24px;
}

.language-card {
min-height: 64px;
}

.hero-image {
width: 100%;
max-width: 1200px;
height: auto;
display: block;
margin: 0 auto 30px auto;
border-radius: 18px;
}
  
.language-card span {
font-size: 18px;
font-weight: 400;
}
}
</style>
</head>

<body>

<div class="top-line"></div>

<main class="page">

<div class="main-box">

<img
src="kiwiaus-australia-new-zealand.png"
alt="KiwiAus Business Australia and New Zealand"
class="hero-image"
>

</div>

<h1>
KiwiAus Business Australia
</h1>

<div class="subtitle">
Business in Australia. Made Clear.
</div>

<p class="welcome">
Select your language
</p>

<section class="language-grid">

<a href="/en/" class="language-card">
<span>English</span>
</a>

<a href="/ru/" class="language-card">
<span>Русский</span>
</a>

<a href="/zh-hk/" class="language-card">
<span>香港中文</span>
</a>

<a href="/de/" class="language-card">
<span>Deutsch</span>
</a>

</section>

<div class="contact">
<a href="mailto:info@kiwiaus.com">
info@kiwiaus.com
</a>
</div>

<footer>
© 2026 KiwiAus Business Australia
</footer>

</div>

</main>

</body>
</html>
