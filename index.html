<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="KiwiAus Business Australia — professional Australian business solutions."
>

<title>KiwiAus Business Australia</title>

<style>
/* ===== KIWIAUS LANGUAGE SECTION DESIGN ===== */

.welcome {
display: block !important;
width: 100% !important;
text-align: center !important;
font-size: 26px !important;
font-weight: 700 !important;
color: #173b63 !important;
margin: 20px auto 10px auto !important;
line-height: 1.3 !important;
}

.language-grid {
width: 100% !important;
max-width: 760px !important;
display: grid !important;
grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
gap: 20px !important;
margin: 25px auto 0 auto !important;
padding: 0 !important;
}

.language-card {
width: 100% !important;
min-height: 95px !important;
display: flex !important;
align-items: center !important;
justify-content: center !important;
box-sizing: border-box !important;

background: #ffffff !important;
border: 1px solid #e2e6ea !important;
border-top: 3px solid #c58a28 !important;
border-radius: 16px !important;

box-shadow: 0 8px 24px rgba(20, 50, 80, 0.08) !important;

text-decoration: none !important;
transition: all 0.2s ease !important;
}

.language-card span {
display: block !important;
font-size: 23px !important;
font-weight: 500 !important;
color: #17476f !important;
text-align: center !important;
line-height: 1.2 !important;
}

.language-card:hover {
transform: translateY(-3px) !important;
box-shadow: 0 12px 28px rgba(20, 50, 80, 0.14) !important;
border-top-color: #d8a544 !important;
}

.language-card:active {
transform: translateY(0) !important;
}

footer {
width: 100% !important;
display: block !important;
text-align: center !important;
margin-top: 35px !important;
clear: both !important;
}

/* ===== MOBILE ===== */

@media (max-width: 700px) {

.welcome {
font-size: 22px !important;
margin-top: 10px !important;
margin-bottom: 18px !important;
}

.language-grid {
grid-template-columns: 1fr !important;
width: 100% !important;
max-width: 100% !important;
gap: 15px !important;
margin-top: 20px !important;
}

.language-card {
min-height: 82px !important;
border-radius: 14px !important;
}

.language-card span {
font-size: 22px !important;
}

footer {
margin-top: 30px !important;
}
}
</style>
</head>

<body>

<div class="top-line"></div>

<main class="page">

<div class="main-box">

<img
src="kiwiaus-australia-new-zealand.png"
alt="KiwiAus Business Australia and New Zealand"
class="hero-image"
>

</div>



<p class="welcome">
Select your language
</p>

<section class="language-grid">

<a href="/en/" class="language-card">
<span>English</span>
</a>

<a href="/ru/" class="language-card">
<span>Русский</span>
</a>

<a href="/zh-hk/" class="language-card">
<span>香港中文</span>
</a>

<a href="/de/" class="language-card">
<span>Deutsch</span>
</a>

</section>

<div class="contact">
<a href="mailto:info@kiwiaus.com">
info@kiwiaus.com
</a>
</div>

<footer>
© 2026 KiwiAus Business Australia
</footer>

</div>

</main>

</body>
</html>
