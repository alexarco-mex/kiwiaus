<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="KiwiAus Business Australia & New Zealand — professional Australian and New Zealand company formation, corporate setup and business support."
>

<title>KiwiAus Business Australia & New Zealand</title>


<style>

/* ==================================================
KIWIAUS
AUSTRALIA & NEW ZEALAND
MAIN LANGUAGE PAGE
================================================== */


/* ===== GENERAL ===== */

* {
box-sizing: border-box;
}

html,
body {
width: 100%;
margin: 0;
padding: 0;
overflow-x: hidden;
}

body {
background: #f8fafc;
color: #172033;
font-family: Arial, Helvetica, sans-serif;
}


/* ===== GOLD TOP LINE ===== */

.top-line {
width: 100%;
height: 4px;
background: #c58a28;
}


/* ===== PAGE ===== */

.page {
width: 100%;
max-width: 1200px;
margin: 0 auto;
padding: 42px 24px 50px 24px;
display: block;
}


/* ===== MAIN HERO IMAGE ===== */

.main-box {
width: 100%;
max-width: 1100px;
margin: 0 auto;
padding: 0;
display: block;
}

.hero-image {
width: 100%;
max-width: 1100px;
height: auto;
display: block;
margin: 0 auto;
border-radius: 20px;

box-shadow:
0 12px 35px
rgba(20, 50, 80, 0.10);
}


/* ===== LANGUAGE TITLE ===== */

.welcome {
display: block;
width: 100%;

text-align: center;

font-size: 26px;
font-weight: 700;

color: #173b63;

margin:
34px auto
8px auto;

line-height: 1.3;
}


/* ===== LANGUAGE GRID ===== */

.language-grid {
width: 100%;
max-width: 760px;

display: grid;

grid-template-columns:
repeat(2, minmax(0, 1fr));

gap: 20px;

margin:
26px auto
0 auto;

padding: 0;
}


/* ===== LANGUAGE BUTTONS ===== */

.language-card {
width: 100%;

min-height: 95px;

display: flex;

align-items: center;
justify-content: center;

background: #ffffff;

border:
1px solid
#e2e6ea;

border-top:
3px solid
#c58a28;

border-radius: 16px;

box-shadow:
0 8px 24px
rgba(20, 50, 80, 0.08);

text-decoration: none;

transition:
transform 0.2s ease,
box-shadow 0.2s ease,
border-color 0.2s ease;
}


/* ===== LANGUAGE TEXT ===== */

.language-card span {
display: block;

font-size: 23px;
font-weight: 500;

color: #17476f;

text-align: center;

line-height: 1.2;
}


/* ===== HOVER EFFECT ===== */

.language-card:hover {
transform:
translateY(-3px);

box-shadow:
0 12px 28px
rgba(20, 50, 80, 0.14);

border-top-color:
#d8a544;
}


/* ===== CLICK EFFECT ===== */

.language-card:active {
transform:
translateY(0);
}


/* ===== EMAIL ===== */

.contact {
width: 100%;

text-align: center;

margin-top: 34px;

font-size: 17px;
}

.contact a {
color: #17476f;

text-decoration: none;

font-weight: 500;
}

.contact a:hover {
color: #c58a28;
}


/* ===== FOOTER ===== */

footer {
width: 100%;

display: block;

text-align: center;

margin-top: 20px;

color: #8a929c;

font-size: 14px;

clear: both;
}


/* ==================================================
MOBILE
================================================== */

@media (max-width: 700px) {

.top-line {
height: 3px;
}

.page {
width: 100%;

padding:
28px 16px
40px 16px;
}

.main-box {
width: 100%;
max-width: 100%;
}

.hero-image {
width: 100%;
max-width: 100%;

height: auto;

margin: 0 auto;

border-radius: 14px;

box-shadow:
0 8px 24px
rgba(20, 50, 80, 0.09);
}

.welcome {
font-size: 22px;

margin-top: 27px;

margin-bottom: 16px;
}

.language-grid {
width: 100%;

max-width: 100%;

grid-template-columns: 1fr;

gap: 15px;

margin-top: 18px;
}

.language-card {
width: 100%;

min-height: 82px;

border-radius: 14px;
}

.language-card span {
font-size: 22px;
}

.contact {
margin-top: 30px;

font-size: 16px;
}

footer {
margin-top: 18px;

font-size: 13px;
}
}


/* ===== VERY SMALL PHONES ===== */

@media (max-width: 400px) {

.page {
padding-left: 12px;
padding-right: 12px;
}

.welcome {
font-size: 21px;
}

.language-card {
min-height: 78px;
}

.language-card span {
font-size: 21px;
}

}

</style>

</head>


<body>


<div class="top-line"></div>


<main class="page">


<div class="main-box">

<img
src="kiwiaus-australia-new-zealand.png"
alt="KiwiAus Business Australia and New Zealand"
class="hero-image"
>

</div>


<p class="welcome">
Choose your language
</p>


<section class="language-grid">


<a
href="/en/"
class="language-card"
>
<span>English</span>
</a>


<a
href="/ru/"
class="language-card"
>
<span>Русский</span>
</a>


<a
href="/zh-hk/"
class="language-card"
>
<span>香港中文</span>
</a>


<a
href="/de/"
class="language-card"
>
<span>Deutsch</span>
</a>


</section>


<div class="contact">

<a href="mailto:info@kiwiaus.com">
info@kiwiaus.com
</a>

</div>


<footer>
© 2026 KiwiAus Business Australia
</footer>


</main>


</body>

</html>

</main>

</body>
</html>
