<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="KiwiAus Business Australia & New Zealand — professional Australian and New Zealand company formation, corporate setup and business support."
>

<title>KiwiAus Business Australia & New Zealand</title>

<style>

/* ==================================================
KIWIAUS
AUSTRALIA & NEW ZEALAND
MAIN LANGUAGE PAGE
================================================== */

* {
box-sizing: border-box;
}

html,
body {
width: 100%;
margin: 0;
padding: 0;
overflow-x: hidden;
}

body {
background: #f8fafc;
color: #172033;
font-family: Arial, Helvetica, sans-serif;
}

.top-line {
width: 100%;
height: 4px;
background: #c58a28;
}

.page {
width: 100%;
max-width: 1180px;
margin: 0 auto;
padding: 36px 24px 42px 24px;
display: block;
}

.main-box {
width: 100%;
max-width: 1040px;
margin: 0 auto;
padding: 0;
display: block;
}

.hero-image {
width: 100%;
max-width: 1040px;
height: auto;
display: block;
margin: 0 auto;
border-radius: 18px;
box-shadow: 0 10px 28px rgba(20, 50, 80, 0.08);
}

.welcome {
display: block;
width: 100%;
text-align: center;
font-size: 24px;
font-weight: 700;
color: #173b63;
margin: 30px auto 8px auto;
line-height: 1.3;
}

.language-grid {
width: 100%;
max-width: 620px;
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 18px;
margin: 24px auto 0 auto;
padding: 0;
}

.language-card {
width: 100%;
min-height: 78px;
display: flex;
align-items: center;
justify-content: center;
background: #ffffff;
border: 1px solid #e2e6ea;
border-top: 3px solid #c58a28;
border-radius: 14px;
box-shadow: 0 6px 18px rgba(20, 50, 80, 0.07);
text-decoration: none;
transition:
transform 0.2s ease,
box-shadow 0.2s ease,
border-color 0.2s ease;
}

.language-card span {
display: block;
font-size: 21px;
font-weight: 500;
color: #17476f;
text-align: center;
line-height: 1.2;
}

.language-card:hover {
transform: translateY(-2px);
box-shadow: 0 10px 24px rgba(20, 50, 80, 0.12);
border-top-color: #d8a544;
}

.language-card:active {
transform: translateY(0);
}

.contact {
width: 100%;
text-align: center;
margin-top: 30px;
font-size: 16px;
}

.contact a {
color: #17476f;
text-decoration: none;
font-weight: 500;
}

.contact a:hover {
color: #c58a28;
}

footer {
width: 100%;
display: block;
text-align: center;
margin-top: 16px;
color: #8a929c;
font-size: 14px;
clear: both;
}

/* ===== MOBILE ===== */

@media (max-width: 700px) {

.top-line {
height: 3px;
}

.page {
width: 100%;
padding: 24px 14px 36px 14px;
}

.main-box {
width: 100%;
max-width: 100%;
}

.hero-image {
width: 100%;
max-width: 100%;
height: auto;
margin: 0 auto;
border-radius: 13px;
box-shadow: 0 8px 22px rgba(20, 50, 80, 0.08);
}

.welcome {
font-size: 21px;
margin-top: 24px;
margin-bottom: 14px;
}

.language-grid {
width: 100%;
max-width: 100%;
grid-template-columns: 1fr;
gap: 14px;
margin-top: 16px;
}

.language-card {
min-height: 76px;
border-radius: 13px;
}

.language-card span {
font-size: 21px;
}

.contact {
margin-top: 26px;
font-size: 16px;
}

footer {
margin-top: 16px;
font-size: 13px;
}
}

/* ===== VERY SMALL PHONES ===== */

@media (max-width: 400px) {

.page {
padding-left: 10px;
padding-right: 10px;
}

.welcome {
font-size: 20px;
}

.language-card {
min-height: 72px;
}

.language-card span {
font-size: 20px;
}
}

</style>

</head>

<body>

<div class="top-line"></div>

<main class="page">

<div class="main-box">

<img
src="kiwiaus-australia-new-zealand.png"
alt="KiwiAus Business Australia and New Zealand"
class="hero-image"
>

</div>

/* <p class="welcome">
Select your language
</p> */

<section class="language-grid">

<a href="/en/" class="language-card">
<span>English</span>
</a>

<a href="/ru/" class="language-card">
<span>Русский</span>
</a>

<a href="/zh-hk/" class="language-card">
<span>香港中文</span>
</a>

<a href="/de/" class="language-card">
<span>Deutsch</span>
</a>

</section>

<div class="contact">

<a href="mailto:info@kiwiaus.com">
info@kiwiaus.com
</a>

</div>

<footer>
© 2026 KiwiAus Business Australia
</footer>

</main>

</body>

</html>
