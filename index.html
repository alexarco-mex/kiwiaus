<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="KiwiAus Business Australia — professional Australian business solutions."
>

<title>KiwiAus Business Australia</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
background: linear-gradient(
180deg,
#ffffff 0%,
#f5f7f9 100%
);
color: #172033;
font-family: Arial, Helvetica, sans-serif;
}

.top-line {
width: 100%;
height: 6px;
background: #c58a28;
}

.page {
display: flex;
min-height: calc(100vh - 6px);
align-items: center;
justify-content: center;
padding: 35px 20px;
}

.main-box {
width: 100%;
max-width: 950px;
text-align: center;
}

.logo {
display: block;
width: 23%;
max-width: 290px;
min-width: 190px;
height: auto;
margin: 0 auto 25px;
background: #ffffff;
border: 1px solid #dfe4e9;
border-radius: 14px;
box-shadow: 0 10px 28px rgba(30, 50, 70, 0.10);
}

h1 {
margin: 0 0 8px;
color: #111820;
font-size: 40px;
line-height: 1.15;
}

.subtitle {
margin-bottom: 13px;
color: #b77d18;
font-size: 21px;
font-weight: 700;
}

.welcome {
margin: 0 0 35px;
color: #687282;
font-size: 15px;
line-height: 1.6;
}

.language-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 19px;
width: 100%;
margin: 0 auto;
}

.language-card {
display: flex;
min-height: 145px;
align-items: center;
justify-content: center;
padding: 25px 18px;
background: #ffffff;
border: 1px solid #dfe4e9;
border-top: 5px solid #c58a28;
border-radius: 13px;
color: #064a78;
text-decoration: none;
box-shadow: 0 9px 25px rgba(30, 50, 70, 0.07);
transition:
transform 0.2s ease,
box-shadow 0.2s ease,
border-color 0.2s ease;
}

.language-card:hover {
transform: translateY(-6px);
border-color: #c58a28;
box-shadow: 0 16px 34px rgba(30, 50, 70, 0.14);
}

.language-card span {
font-size: 24px;
font-weight: 750;
line-height: 1.3;
}

.contact {
margin-top: 30px;
color: #7a8490;
font-size: 13px;
}

.contact a {
color: #064a78;
font-weight: 700;
text-decoration: none;
}

footer {
margin-top: 25px;
color: #8a929c;
font-size: 11px;
}

@media (max-width: 720px) {
.page {
align-items: flex-start;
padding-top: 28px;
}

.logo {
width: 52%;
min-width: 185px;
max-width: 280px;
}

h1 {
font-size: 30px;
}

.subtitle {
font-size: 19px;
}

.language-grid {
grid-template-columns: 1fr;
max-width: 430px;
}

.language-card {
min-height: 92px;
}
}

@media (max-width: 430px) {
.logo {
width: 70%;
min-width: 0;
}

h1 {
font-size: 27px;
}

.welcome {
margin-bottom: 28px;
}

.language-card span {
font-size: 22px;
}
}
</style>
</head>

<body>

<div class="top-line"></div>

<main class="page">

<div class="main-box">

<img
src="IMG_3917.jpg"
alt="KiwiAus Business Australia"
class="logo"
>

<h1>
KiwiAus Business Australia
</h1>

<div class="subtitle">
Business in Australia. Made Clear.
</div>

<p class="welcome">
Select your language
</p>

<section class="language-grid">

<a href="/en/" class="language-card">
<span>English</span>
</a>

<a href="/ru/" class="language-card">
<span>Русский</span>
</a>

<a href="/zh-hk/" class="language-card">
<span>香港中文</span>
</a>

</section>

<div class="contact">
<a href="mailto:info@kiwiaus.com">
info@kiwiaus.com
</a>
</div>

<footer>
© 2026 KiwiAus Business Australia
</footer>

</div>

</main>

</body>
</html>
